name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  examples:
    runs-on: ubuntu-latest
    container:
      image: sourceengineers/container-armgcc:edf61b27
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure and Build Examples
        run: cmake --workflow --preset ci-example

      - name: Configure and Build String Replacement Example
        run: cmake --workflow --preset ci-example-string-replacement

      - name: Install Examples
        run: cmake --install build/x86_64/release --component examples

      - name: Install String Replacement Example
        run: cmake --install build/x86_64/string_replacment --component example-string-replacement

      - name: Upload Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: examples
          path: release
          retention-days: 1

  unit-tests:
    runs-on: ubuntu-latest
    container:
      image: sourceengineers/container-armgcc:edf61b27
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure, Build and Test
        run: cmake --workflow --preset ci-test

      - name: Install Tests
        run: cmake --install build/x86_64/test --component tests

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unit-tests
          path: release
          retention-days: 1

  static-analysis:
    runs-on: ubuntu-latest
    container:
      image: sourceengineers/container-armgcc:edf61b27
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Run Static Analysis
        run: cmake --workflow --preset ci-static-analysis

  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python dependencies
        working-directory: doc
        run: uv sync

      - name: Build Sphinx HTML
        working-directory: doc
        env:
          READTHEDOCS: "True"
        run: uv run -- sphinx-build -M html . ./_build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: doc/_build/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
